<!doctype html>
<html lang="{{ site.lang | default: 'nl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101918">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body data-items-url="{{ '/items.json' | relative_url }}">
  {{ content }}
  <script src="{{ '/app.js' | relative_url }}" defer></script>
</body>
</html>
